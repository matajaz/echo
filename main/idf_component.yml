# Managed component dependencies for echo's display bring-up.
#
# Only ONE real managed-component dependency is needed:
#
# - waveshare/custom_io_expander_ch32v003: drives the onboard CH32V003 I/O
#   expander over I2C. LCD reset and backlight PWM are NOT direct ESP32
#   GPIOs on this board -- both go through this chip (confirmed in
#   docs.waveshare.com/ESP32-C5-Touch-LCD-2.8's pin tables: LCD_RST ->
#   "CH32 EXIO1", LCD_BL -> "CH32 PWM"). Verified real API via the
#   component's own source (waveshareteam/Waveshare-ESP32-components,
#   sensor/custom_io_expander_ch32v003/include/custom_io_expander_ch32v003.h):
#   custom_io_expander_new_i2c_ch32v003(), custom_io_expander_set_pwm(),
#   fixed I2C address 0x24 (CUSTOM_IO_EXPANDER_I2C_CH32V003_ADDRESS).
#
# ST7789 panel support does NOT need a separate managed component --
# esp_lcd_panel_st7789.h ships with ESP-IDF's own built-in esp_lcd
# component (confirmed: components/esp_lcd/include/esp_lcd_panel_st7789.h
# in the esp-idf v5.5.4 tree, matching the vendor board file's own
# `REQUIRES ... esp_lcd ...` in its CMakeLists.txt -- no extra dependency
# needed, just the usual esp_driver_gpio/esp_driver_i2c the project
# already pulls in transitively). This file originally also listed a
# (nonexistent) "espressif/esp_lcd_panel_st7789" package -- caught and
# removed before building, since the real registry has no such name.
# KNOWN UPSTREAM BUG -- not fixed by this file, do not expect a clean
# resolve to build as-is.
# waveshare/custom_io_expander_ch32v003 has an incomplete REQUIRES in its
# own CMakeLists.txt: it lists only "driver" (the pre-5.x umbrella driver
# component), but its public header includes driver/i2c_master.h. Verified
# against this IDF tree (6.2.0): i2c_master.h lives ONLY in
# components/esp_driver_i2c/include/driver/, and components/driver/ only
# REQUIRES esp_hal_i2c -- NOT esp_driver_i2c. So "driver" does not
# transitively supply that include path, and a clean resolve fails with
# "fatal error: driver/i2c_master.h: No such file or directory".
# managed_components/ is gitignored and regenerated by the resolver, so
# patching it in place does not persist. After any fresh resolve you must
# re-apply, in
# managed_components/waveshare__custom_io_expander_ch32v003/CMakeLists.txt:
#   REQUIRES "driver"  ->  REQUIRES "driver" "esp_driver_i2c"
# The durable fix is to vendor the component: copy it into the repo and
# point a local (path/override_path) dependency at the in-tree copy that
# carries the corrected REQUIRES, so the resolver cannot regenerate the
# broken copy. That is not done here, so the manual step above is still
# required. Note main/ also includes driver/i2c_master.h and declares no
# REQUIRES of its own, so main/CMakeLists.txt needs esp_driver_i2c too.
dependencies:
  idf: ">=5.3"
  waveshare/custom_io_expander_ch32v003: "^1.0.1"
  waveshare/esp_lcd_touch_cst3530: "^0.0.2"
  # LVGL integration. esp_lvgl_port is Espressif's maintained adapter
  # (stable 1.x; the vendor 08_bookesia demo used the newer, beta-only
  # espressif/esp_lvgl_adapter 0.x -- we deliberately use the stable port
  # instead since this is a from-scratch app, not a fork of that demo).
  # It attaches to the SAME panel/panel_io/touch handles display.c/touch.c
  # already create (via display_get_panel/_panel_io and touch_get_handle),
  # so no SPI/panel re-init. LVGL pinned to 8.x for a stable draw-buffer
  # API (avoids the v9 color_format/swap_bytes churn; our panel already
  # does the RGB565 endian fix at the ST7789 data_endian level, so NO
  # extra byte-swap must be enabled in the LVGL layer).
  espressif/esp_lvgl_port: "^1.0.0"
  lvgl/lvgl: "~8.4.0"
  # Onboard sensors, all on the shared I2C bus (reuse display_get_i2c_bus()).
  # APIs verified against the real component headers before coding:
  #   qmi8658_init/_read_accel_mps2/_read_gyro_dps/_read_temp (addr 0x6B/0x6A)
  #   pcf85063a_init/_get_time_date (addr 0x51)
  #   shtc3_device_create/_get_th/_get_id (addr 0x70)
  waveshare/qmi8658: "^1.0.0"
  waveshare/pcf85063a: "^1.0.1"
  pedrominatel/shtc3: "^1.0.0"
  # Audio: ES8311 codec over I2S + I2C control. esp_codec_dev provides
  # es8311_codec_new / audio_codec_new_i2s_data / audio_codec_new_i2c_ctrl.
  # I2S SCLK=24/WS=25/DOUT=26/DSIN=27, MCLK none; PA enable via CH32
  # expander pin 3 (verified against the vendor BSP, not guessed). NOTE:
  # the vendor BSP wrote "~1.5" but no 1.5.x exists in the registry (max
  # is the 1.3.x line); pinned ~1.3 (verified via the components API).
  espressif/esp_codec_dev: "~1.3"
